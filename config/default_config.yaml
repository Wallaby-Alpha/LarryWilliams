# MEXC Larry Williams-Style Relative Strength & Pullback System Configuration
# All parameters are configurable and testable independently.

system:
  name: "MEXC Williams %R Relative Strength System"
  version: "1.0.0"
  base_dir: "data_storage"
  log_level: "INFO"

universe:
  quote_asset: "USDT"
  min_24h_quote_volume_usd: 5000000.0  # Configurable: 1M, 2.5M, 5M, 10M, 25M
  exclude_coins:
    - "BTCUSDT"  # BTC is the benchmark regime, not an altcoin candidate
    - "USDCUSDT"
    - "TUSDUSDT"
    - "FDUSDUSDT"
    - "DAIUSDT"
    - "EURUSDT"
    - "USDDUSDT"
    - "BUSDUSDT"
  exclude_leveraged_patterns:
    - "3L"
    - "3S"
    - "5L"
    - "5S"
    - "UP"
    - "DOWN"
    - "BULL"
    - "BEAR"
  min_history_days: 90  # Exclude coins without sufficient historical bars

timeframes:
  regime: "1d"         # Daily timeframe for broad regime & trend
  trend: "4h"          # 4-hour timeframe for intermediate trend
  primary_entry: "1h"  # Configurable primary entry: 15m, 30m, 1h, 4h

btc_regime:
  enabled: true
  fast_sma: 20
  slow_sma: 50         # Default: 50-day SMA (test 20, 50, 100, 200)
  require_rising: true # 50-day SMA is rising
  slope_lookback: 5    # Days to measure SMA slope
  return_lookback: 30  # Days for return calculation (test 7, 30)
  min_return_pct: 0.0  # BTC 30-day return > 0%
  use_atr_filter: false
  use_williams_filter: false

relative_strength:
  composite_score_min: 70.0    # Composite Leadership Score threshold (40% 30D + 35% 7D + 25% 90D)
  rs_30d_min_percentile: 70.0  # Macro 30-day leader threshold
  rs_7d_min_percentile: 40.0   # 7-day floor (allows multi-day pullbacks without disqualifying leaders)
  rs_90d_min_percentile: 0.0   # Optional filter
  composite_weights:
    weight_30d: 0.40           # 40% 30-day relative strength
    weight_7d: 0.35            # 35% 7-day relative strength
    weight_90d: 0.25           # 25% 90-day relative strength

trend:
  daily_fast_ma: 20            # 20D SMA
  daily_slow_ma: 50            # 50D SMA
  require_price_above_slow: true
  require_fast_above_slow: true
  require_slow_rising: true
  four_hour_ma: 50             # 50-period 4H SMA
  require_4h_price_above_ma: true
  require_4h_ma_rising: true

extension_filter:
  enabled: true
  ma_type: "EMA"               # EMA or SMA
  ma_period: 20                # 20D EMA
  max_extension_pct: 0.20      # 20% max extension (protects against vertical blow-off chases while allowing healthy crypto pullbacks)

pullback:
  model: "model_a"             # model_a: >= 1 ATR drop from swing high
                               # model_b: 2% to 5% drop
                               # model_c: 0.5 to 1.5 ATR retrace
                               # model_d: below 1H EMA20 & above 1H SMA50
  swing_high_lookback: 24      # Lookback candles for recent local high
  min_pullback_atr: 1.0        # Model A ATR threshold
  min_pullback_pct: 0.02       # Model B min pct
  max_pullback_pct: 0.08       # Model B max pct
  model_c_min_atr: 0.5
  model_c_max_atr: 1.8

williams_r:
  period: 14                   # 14-period Williams %R
  oversold_threshold: -80.0    # Default -80.0 (test -75, -80, -85, -90)
  require_cross_above: true    # %R crosses back ABOVE threshold
  momentum_failure:
    enabled: false             # Flag Williams %R momentum failure divergence
    first_extreme: -90.0
    second_failure_min: -80.0

pullback_relative_strength:
  enabled: false               # Test whether relative strength during pullback adds edge
  timeframe: "1h"              # 1h, 4h, or 24h
  min_excess_return: 0.005     # Coin outperformed BTC by >= 0.5% during pullback

volume_confirmation:
  model: "none"                # "none", "contracting_pullback", "expanding_reversal", "both"
  avg_period: 20
  pullback_vol_ratio_max: 1.0  # Pullback volume <= average volume
  reversal_vol_ratio_min: 1.05 # Reversal volume > recent average volume

price_action_confirmation:
  model: "close_above_prev_high" # "close_above_prev_high" (Default)
                                 # "break_swing_high"
                                 # "close_above_ema20"
                                 # "bullish_engulfing"
                                 # "williams_cross_only"

execution:
  fill_timing: "next_candle_open" # Avoid look-ahead bias
  taker_fee_pct: 0.0005           # MEXC 0.05% taker
  maker_fee_pct: 0.0000           # MEXC 0.00% maker
  slippage_pct: 0.0005            # 0.05% slippage
  spread_pct: 0.0002              # 0.02% spread
  collision_resolution: "conservative_stop_first" # "conservative_stop_first", "target_first"

risk_and_sizing:
  risk_per_trade_pct: 0.005       # 0.5% equity risk per trade (test 0.25%, 0.5%, 0.75%, 1.0%)
  max_position_equity_pct: 0.20   # Maximum 20% portfolio equity in single coin
  stop_loss_model: "atr"          # "pullback_low", "atr", "structural_atr"
  atr_multiplier: 1.5             # Default 1.5 ATR (test 1.0, 1.25, 1.5, 1.75, 2.0)
  structural_atr_buffer: 0.5      # Buffer below pullback low

exit_strategy:
  model: "2R"                     # "1R", "1.5R", "2R", "3R", "trailing_stop",
                                  # "williams_overbought_reversal", "rs_loss", "partial_2r_trail"
  trailing_atr_mult: 1.5
  overbought_threshold: -20.0
  partial_ratio: 0.5              # 50% closed at target R, remaining trailed

time_stop:
  enabled: true
  max_holding_hours: 48           # Test 12, 24, 36, 48, 72
  min_profit_threshold_r: 0.5     # If R < 0.5 after max hours, close trade

btc_regime_exit:
  action: "stop_new_entries"      # "do_nothing", "exit_all", "stop_new_entries"

portfolio_constraints:
  max_open_positions: 5           # Default 5 (test 3, 5, 8, 10, 15)
  max_portfolio_risk_pct: 0.025   # Default 2.5% max risk across all positions
  max_correlation_filter: 0.85

data_validation:
  check_missing_candles: true
  check_duplicates: true
  check_spikes: true
  max_spike_pct: 0.50             # 50% single candle spike flag
  log_anomalies: true
